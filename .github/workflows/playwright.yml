name: Playwright Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']   # README-only changes don't need a test run
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Show why tests failed
        if: failure()
        run: |
          for f in $(find test-results -name error-context.md); do
            echo "::group::$f"
            sed -n '/# Error details/,$p' "$f" | head -120
            echo "::endgroup::"
          done

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
